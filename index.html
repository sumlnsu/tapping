<!doctype html>
<html lang="ko" data-palette="volt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="고르지 말고, 넘기세요. 감도 높은 패션 아이템을 한 장씩 보여 주는 원탭 큐레이션">
<title>태핑 TAPPING</title>
<link rel="icon" href="brand/icon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/icon/favicon-32.png" sizes="32x32">
<link rel="icon" href="brand/icon/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="brand/icon/icon-180.png">
<link rel="manifest" href="brand/icon/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="태핑 TAPPING">
<meta property="og:description" content="고르지 말고, 넘기세요.">
<meta property="og:url" content="https://sumlnsu.github.io/tapping/">
<meta property="og:image" content="https://sumlnsu.github.io/tapping/brand/og/og-light.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<script src="copy.js"></script>
</head>
<body class="ds">
<div class="app" id="app">

  <!-- 0. 데이터 받는 동안: 로고 모서리가 접혔다 펴지는 로딩 (브랜드 키트 5-4) -->
  <div class="boot" id="boot" role="status">
    <svg class="loader" viewBox="0 0 100 100" aria-hidden="true"><path class="ld-b" d="M32 10H68A22 22 0 0 1 90 32V68A22 22 0 0 1 68 90H32A22 22 0 0 1 10 68V32A22 22 0 0 1 32 10Z"/><path class="ld-c" d="M94 48V94H48Z"/><path class="ld-f" d="M90 52H74A22 22 0 0 0 52 74V90Z"/></svg>
    <span class="boot__t" id="boot-label"></span>
  </div>
  <script>document.getElementById('boot-label').textContent = window.TAPPING_COPY.loading;</script>

  <!-- 1. 시작 설정 -->
  <section class="screen onboard" id="onboard" hidden aria-labelledby="ob-title">
    <div class="ob-main">
      <header class="ob-head">
        <div class="ob-top">
          <button class="icon-btn ob-back" id="ob-back" type="button" aria-label="피드로 돌아가기" hidden>
            <svg class="ico" data-i="chevron-left" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#chevron-left"/></svg>
          </button>
          <p class="wordmark ob-logo" role="img" aria-label="tapping"><svg class="lg" viewBox="0 0 100 100" aria-hidden="true"><path class="lg-b" d="M32 10H68A22 22 0 0 1 90 32V52L52 90H32A22 22 0 0 1 10 68V32A22 22 0 0 1 32 10Z"/><path class="lg-f" d="M90 52H74A22 22 0 0 0 52 74V90Z"/></svg><span class="lg-l" style="--n:0">t</span><span class="lg-l" style="--n:1">a</span><span class="lg-l" style="--n:2">p</span><span class="lg-l" style="--n:3">p</span><span class="lg-l" style="--n:4">i</span><span class="lg-l" style="--n:5">n</span><span class="lg-l" style="--n:6">g</span></p>
          <h2 class="ob-edit-title">설정 바꾸기</h2>
        </div>
        <div class="ob-hero">
          <h1 class="display ob-title" id="ob-title">고르지 말고,<br><mark>넘기세요.</mark></h1>
          <!-- 앱 아이콘 깊이 연출 (5-2): 바탕·면·접힘 세 겹이 기울기에 서로 다른 깊이로 움직인다 -->
          <div class="tile" id="ob-tile" aria-hidden="true"><div class="tile__in"><span class="tile__bg"></span><svg class="tile__face" viewBox="0 0 100 100"><path d="M32 10H68A22 22 0 0 1 90 32V52L52 90H32A22 22 0 0 1 10 68V32A22 22 0 0 1 32 10Z"/></svg><svg class="tile__flap" viewBox="0 0 100 100"><path d="M90 52H74A22 22 0 0 0 52 74V90Z"/></svg></div></div>
        </div>
        <p class="lead">세 가지만 정하면 바로 시작해요.</p>
      </header>

      <fieldset class="q">
        <legend>성별</legend>
        <div class="seg seg--full" data-key="gender" data-single>
          <button class="seg__btn" type="button" data-v="men">남성</button>
          <button class="seg__btn" type="button" data-v="women">여성</button>
          <button class="seg__btn" type="button" data-v="all">전체</button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>카테고리 <span class="hint">여러 개 선택</span></legend>
        <div class="picks" data-key="cats">
          <button type="button" data-v="all">전체</button>
          <button type="button" data-v="outer">아우터</button>
          <button type="button" data-v="top">상의</button>
          <button type="button" data-v="bottom">하의</button>
          <button type="button" data-v="shoes">신발</button>
          <button type="button" data-v="bag">가방</button>
          <button type="button" data-v="hat">모자</button>
          <button type="button" data-v="accessory">액세서리</button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>가격 <span class="hint">여러 개 선택</span></legend>
        <div class="picks" data-key="prices">
          <button type="button" data-v="all">전체</button>
          <button type="button" data-v="0">~10만</button>
          <button type="button" data-v="1">10~30만</button>
          <button type="button" data-v="2">30~70만</button>
          <button type="button" data-v="3">70만~</button>
        </div>
      </fieldset>

      <div class="ob-foot">
        <p class="count" id="ob-count" aria-live="polite"></p>
        <button class="btn btn--lg btn--block" id="start" type="button">시작하기</button>
        <button class="link" id="ob-login" type="button" hidden>이미 계정이 있나요? <b>로그인</b></button>
      </div>
    </div>
    <div class="ob-art" id="ob-art" aria-hidden="true"></div>
  </section>

  <!-- 2. 피드 -->
  <section class="screen feed" id="feed" hidden aria-label="상품 피드">
    <header class="topbar">
      <span class="wordmark" role="img" aria-label="tapping"><svg class="lg" viewBox="0 0 100 100" aria-hidden="true"><path class="lg-b" d="M32 10H68A22 22 0 0 1 90 32V52L52 90H32A22 22 0 0 1 10 68V32A22 22 0 0 1 32 10Z"/><path class="lg-f" d="M90 52H74A22 22 0 0 0 52 74V90Z"/></svg>tapping</span>
      <div class="top-actions">
        <button class="icon-btn" id="open-likes" type="button" aria-label="찜 목록">
          <svg class="ico" data-i="heart" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#heart"/></svg>
          <span class="badge-count" id="like-count"></span>
        </button>
        <button class="icon-btn" id="open-settings" type="button" aria-label="설정 바꾸기">
          <svg class="ico" data-i="sliders" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#sliders"/></svg>
        </button>
        <button class="icon-btn" id="open-account" type="button" aria-label="로그인">
          <svg class="ico" data-i="user" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#user"/></svg>
          <span class="avatar" id="acct-initial"></span>
        </button>
      </div>
    </header>

    <div class="nudge" id="nudge" hidden>
      <span>로그인하면 취향을 학습해 더 잘 골라 드려요</span>
      <button class="n-login" id="nudge-login" type="button">로그인</button>
      <button class="n-close" id="nudge-close" type="button" aria-label="닫기"><svg class="ico" data-i="close" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#close"/></svg></button>
    </div>

    <main class="viewer" id="viewer" data-phase="idle">
      <!-- 당겨서 새로 섞기 (터치) -->
      <div class="pull" aria-hidden="true">
        <svg viewBox="10 10 80 80"><path class="lg-b" d="M32 10H68A22 22 0 0 1 90 32V52L52 90H32A22 22 0 0 1 10 68V32A22 22 0 0 1 32 10Z"/><path class="lg-f" id="pull-flap" d="M90 52H74A22 22 0 0 0 52 74V90Z"/></svg>
        <span id="pull-label"></span>
      </div>

      <!-- 카드 2장: 뒤 카드에는 다음 상품을 항상 미리 깔아 둔다 (Peel 전환) -->
      <div class="deck" id="deck">
        <article class="pcard back" id="shell-back" aria-hidden="true"></article>
        <article class="pcard front" id="shell-front">
          <div class="hit" id="stage" role="button" tabindex="0" aria-label="다음 상품 보기"></div>
          <span class="next-cue" aria-hidden="true"><svg class="ico" data-i="arrow-right" viewBox="0 0 24 24"><use href="brand/icons/sprite.svg#arrow-right"/></svg></span>
          <p class="coach" id="coach"></p>
          <div class="actions" id="actions" aria-label="상품 반응">
            <button class="act like" id="btn-like" type="button" aria-label="찜하기 (L)" title="찜하기 (L)" aria-pressed="false">
              <svg class="ico" data-i="heart" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#heart"/></svg>
            </button>
            <button class="act dislike" id="btn-dislike" type="button" aria-label="별로예요 (D)" title="별로예요 (D)">
              <svg class="ico" data-i="thumbs-down" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#thumbs-down"/></svg>
            </button>
            <button class="act buy" id="btn-buy" type="button" aria-label="구매하러 가기 (B)" title="구매하러 가기 (B)">
              <svg class="ico" data-i="bag" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#bag"/></svg>
            </button>
          </div>
          <span class="peel peel--cut" aria-hidden="true"></span>
          <span class="peel peel--flap" aria-hidden="true"><i></i></span>
        </article>
        <div class="buy-toast" id="buy-toast" role="status" hidden>
          <svg class="ico" data-i="external" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#external"/></svg>
          <span data-copy="buyToast"></span>
        </div>
      </div>

      <!-- 한 바퀴 다 봄 -->
      <div class="state state--deck" id="allseen" hidden>
        <div class="state__art" data-art="all-seen"><picture><source media="(prefers-color-scheme: dark)" srcset="brand/states/all-seen-dark.svg"><img src="brand/states/all-seen-light.svg" alt="" width="160" height="160"></picture></div>
        <h2 class="state__t" data-copy="allSeenTitle"></h2>
        <p class="state__b" data-copy="allSeenBody"></p>
        <div class="state__btns">
          <button class="btn btn--lg state__btn" id="reshuffle" type="button"><svg class="ico" data-i="refresh" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#refresh"/></svg><span data-copy="allSeenShuffle"></span></button>
          <button class="btn btn--lg state__btn state__btn--2" id="see-likes" type="button" data-copy="allSeenLikes"></button>
        </div>
      </div>
    </main>
    <p class="sr-only" id="sr-now" aria-live="polite"></p>
  </section>

  <!-- 카드 한 장의 내용 (앞·뒤 카드가 같이 쓴다) -->
  <template id="tpl-body">
    <div class="pbody">
      <figure class="photo" data-theme="light"><div class="pic"><img alt="" referrerpolicy="no-referrer" decoding="async"></div><span class="seq"></span></figure>
      <div class="info">
        <div class="tags">
          <span class="tp-badge tp-badge--collab" style="--n:0" hidden>COLLAB</span>
          <span class="tp-badge tp-badge--new" style="--n:1" hidden>NEW</span>
        </div>
        <p class="mall"></p>
        <h2 class="brand"></h2>
        <p class="p-title"></p>
        <p class="price figure"></p>
      </div>
    </div>
  </template>

  <!-- 3. 찜 목록 -->
  <dialog class="sheet" id="likes" aria-labelledby="likes-title">
    <div class="sheet__grip"></div>
    <div class="sheet__head">
      <h2 class="sheet-title" id="likes-title">찜한 상품 <span class="num" id="likes-total"></span></h2>
      <button class="icon-btn" id="close-likes" type="button" aria-label="닫기"><svg class="ico" data-i="close" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#close"/></svg></button>
    </div>
    <div class="sheet__body">
      <div class="filter-rows">
        <div class="filters" id="like-cats" role="tablist" aria-label="카테고리"></div>
        <div class="filters sub" id="like-subs" role="tablist" aria-label="세부 분류" hidden></div>
      </div>
      <div id="like-list"></div>
      <div class="state" id="likes-empty">
        <div class="state__art" data-art="empty-wishlist"><picture><source media="(prefers-color-scheme: dark)" srcset="brand/states/empty-wishlist-dark.svg"><img src="brand/states/empty-wishlist-light.svg" alt="" width="160" height="160"></picture></div>
        <h3 class="state__t" data-copy="emptyLikesTitle"></h3>
        <p class="state__b" data-copy="emptyLikesBody"></p>
        <div class="state__btns state__btns--auto"><button class="btn btn--lg state__btn" id="empty-go" type="button" data-copy="emptyLikesCta"></button></div>
      </div>
    </div>
  </dialog>

  <!-- 4. 로그인 · 회원가입 · 내 계정 -->
  <dialog class="sheet" id="auth" aria-labelledby="auth-title">
    <div class="sheet__grip"></div>
    <div class="sheet__head">
      <h2 class="sheet-title" id="auth-title">로그인</h2>
      <button class="icon-btn" id="close-auth" type="button" aria-label="닫기"><svg class="ico" data-i="close" viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#close"/></svg></button>
    </div>
    <div class="sheet__body">
      <div id="auth-guest">
        <p class="auth-reason" id="auth-reason"></p>
        <ul class="perks">
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#heart"/></svg>찜한 상품 저장, 어느 기기에서나 보기</li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#thumbs-down"/></svg>싫어요 누른 스타일은 덜 보여 주기</li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><use href="brand/icons/sprite.svg#sparkle"/></svg>반응을 학습해 내 취향대로 추천</li>
        </ul>
        <div class="seg seg--full auth-tabs" role="tablist" aria-label="로그인 또는 회원가입">
          <button class="seg__btn" type="button" role="tab" data-mode="login" aria-selected="true" aria-pressed="true">로그인</button>
          <button class="seg__btn" type="button" role="tab" data-mode="signup" aria-selected="false" aria-pressed="false">회원가입</button>
        </div>
        <form id="auth-form" novalidate>
          <label class="field"><span>이메일</span><input class="input" id="auth-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com"></label>
          <label class="field"><span>비밀번호</span><input class="input" id="auth-pw" type="password" autocomplete="current-password" placeholder="비밀번호"></label>
          <label class="field" id="pw2-field" hidden><span>비밀번호 확인</span><input class="input" id="auth-pw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력"></label>
          <label class="check"><input class="switch" id="auth-keep" type="checkbox" checked><span>자동 로그인</span></label>
          <p class="form-error" id="auth-error" role="alert"></p>
          <button class="btn btn--lg btn--block" id="auth-submit" type="submit">로그인</button>
        </form>
        <p class="fine">베타 서비스예요. 이메일은 로그인과 찜·취향 저장에만 써요.</p>
      </div>

      <div id="auth-user" hidden>
        <div class="me-card">
          <span class="avatar lg" id="me-initial"></span>
          <div><b id="me-email"></b><span class="tp-badge tp-badge--admin role-badge" id="me-admin" hidden>관리자</span><p id="me-keep"></p></div>
        </div>
        <div class="me-stats">
          <div class="stat"><span class="stat__value" id="me-likes">0</span><span class="stat__label">찜</span></div>
          <div class="stat"><span class="stat__value" id="me-reacts">0</span><span class="stat__label">반응 (학습에 쓰인 횟수)</span></div>
        </div>
        <section class="admin" id="admin" hidden>
          <h3 class="section-title">관리자 대시보드</h3>
          <div class="admin-grid" id="admin-grid"></div>
          <h4>많이 찜한 상품</h4>
          <ol class="admin-top" id="admin-top"></ol>
        </section>
        <button class="btn btn--secondary btn--lg btn--block" id="sign-out" type="button">로그아웃</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="feed.js"></script>
<script src="account.js"></script>
<script src="app.js"></script>
</body>
</html>
